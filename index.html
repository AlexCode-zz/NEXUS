<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS — Laboratorio Visual de Universos Generativos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <!-- Canvas 3D -->
      <canvas id="nexus-canvas"></canvas>

      <!-- Interfaz NEXUS Completa -->
      <div id="nexus-ui">
        <header class="ui-header">
          <div class="logo">NEXUS_LAB</div>
          <div class="fps-counter" id="fps">FPS: 60</div>
        </header>

        <aside class="ui-left">
          <div class="control-group">
            <div class="label">Universes</div>
            <button onclick="window.nexusApp.worldManager.activateWorld('cosmos')">COSMOS</button>
            <button onclick="window.nexusApp.worldManager.activateWorld('cyberspace')">CYBER</button>
            <button onclick="window.nexusApp.worldManager.activateWorld('solaris')">SOLARIS</button>
            <button onclick="window.nexusApp.worldManager.activateWorld('singularity')">VOID</button>
          </div>
          <div class="control-group">
            <div class="label">Actions</div>
            <button onclick="location.reload()">RESET</button>
          </div>
        </aside>

        <div class="ui-right">
          <div class="info-panel" id="active-world">Universe: Cosmos</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
