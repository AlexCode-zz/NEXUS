<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS — Laboratorio Visual de Universos Generativos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <!-- Canvas 3D -->
      <canvas id="nexus-canvas"></canvas>

      <!-- Interfaz Mínima / HUD -->
      <div id="nexus-hud">
        <header class="hud-header">
          <h1 class="nexus-logo">NEXUS</h1>
          <p class="hud-subtitle">Laboratorio de Universos Generativos</p>
        </header>

        <div class="hud-status">
          <span class="status-dot"></span>
          <span class="status-text">Sistema Inicializado</span>
        </div>

        <footer class="hud-footer">
          <span class="engine-info">Three.js Engine Ready</span>
        </footer>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
